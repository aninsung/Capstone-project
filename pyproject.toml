[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youth-policy-ai"
version = "0.1.0"
description = "Week 1 policy ingestion and AI API contracts"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
policy-data = "policy_ai.cli:main"

[tool.setuptools.packages.find]
include = ["policy_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
